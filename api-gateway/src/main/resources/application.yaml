spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info